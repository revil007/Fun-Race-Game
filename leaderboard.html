<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>SCI FUN RACE PART 2 2027 — Live Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--font-display:'Rajdhani','Inter',Arial,sans-serif;--font-body:'Inter',Arial,Helvetica,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;font-family:var(--font-body);color:#f8fafc;
  background:
    radial-gradient(circle at 12% 12%, rgba(59,130,246,.26) 0, transparent 24%),
    radial-gradient(circle at 88% 14%, rgba(239,68,68,.22) 0, transparent 24%),
    radial-gradient(circle at 78% 88%, rgba(168,85,247,.2) 0, transparent 26%),
    linear-gradient(135deg,#07111f 0%,#0d1524 45%,#090d18 100%);
  padding:clamp(18px,3vw,40px);
  overflow-x:hidden;
}
.wrap{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:clamp(18px,3vw,30px)}
.badge{
  display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(250,204,21,.55);
  background:rgba(250,204,21,.08);border-radius:999px;padding:8px 16px;
  font-family:var(--font-display);font-size:clamp(11px,1.4vw,13px);letter-spacing:2px;
  color:#fde68a;font-weight:800;
}
h1{
  font-family:var(--font-display);font-weight:800;
  font-size:clamp(28px,5vw,48px);letter-spacing:2px;margin-top:8px;
  text-shadow:0 4px 24px rgba(59,130,246,.35);
}
.liveRow{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.liveText{font-family:var(--font-display);font-weight:700;letter-spacing:1.5px;color:#86efac;font-size:clamp(13px,1.6vw,16px)}
.updated{color:#64748b;font-size:12px;margin-top:4px}

.section-title{
  font-family:var(--font-display);font-weight:800;letter-spacing:1.5px;
  font-size:clamp(14px,1.8vw,18px);color:#94a3b8;text-transform:uppercase;
  margin:clamp(20px,3vw,30px) 0 12px;
}

.rows{display:flex;flex-direction:column;gap:10px}
.row{
  display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:clamp(10px,2vw,20px);
  background:rgba(11,17,29,.85);border:1px solid rgba(71,85,105,.5);
  border-radius:18px;padding:clamp(12px,2vw,18px) clamp(14px,2.4vw,22px);
  backdrop-filter:blur(6px);
}
.row.gold{border-color:rgba(250,204,21,.7);box-shadow:0 0 0 1px rgba(250,204,21,.25),0 12px 34px rgba(250,204,21,.12)}
.row.silver{border-color:rgba(203,213,225,.6)}
.row.bronze{border-color:rgba(217,119,6,.6)}
.rank{
  font-family:var(--font-display);font-weight:800;font-size:clamp(20px,2.6vw,28px);
  text-align:center;color:#94a3b8;
}
.rank.medal{font-size:clamp(26px,3.4vw,36px)}
.teamInfo b{
  display:block;font-family:var(--font-display);font-weight:800;
  font-size:clamp(17px,2.4vw,24px);letter-spacing:.4px;
}
.teamInfo span{display:block;color:#8d99ad;font-size:clamp(11px,1.3vw,13px);margin-top:2px;font-weight:600}
.duration{
  font-family:var(--font-display);font-weight:800;font-variant-numeric:tabular-nums;
  font-size:clamp(20px,3vw,30px);color:#facc15;text-align:right;
}
.status{
  font-family:var(--font-display);font-weight:700;letter-spacing:1px;
  font-size:clamp(13px,1.6vw,16px);text-align:right;
}
.status.running{color:#38bdf8}
.status.waiting{color:#64748b}
.liveTimer{font-variant-numeric:tabular-nums;font-size:clamp(15px,2vw,20px);color:#38bdf8;display:block;margin-top:2px}

.empty{
  text-align:center;color:#64748b;font-size:13px;padding:18px;
  border:1px dashed #2a2a38;border-radius:16px;
}

.leaderBanner{
  display:flex;align-items:center;gap:clamp(12px,2.5vw,20px);flex-wrap:wrap;
  background:linear-gradient(135deg,rgba(250,204,21,.14),rgba(59,130,246,.08));
  border:1.5px solid rgba(250,204,21,.55);border-radius:20px;
  padding:clamp(14px,2.6vw,20px) clamp(16px,3vw,24px);
  margin-bottom:clamp(18px,3vw,26px);
  box-shadow:0 12px 34px rgba(250,204,21,.1);
}
.leaderIcon{font-size:clamp(30px,5vw,42px);line-height:1;animation:leaderPulse 1.4s ease-in-out infinite}
@keyframes leaderPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.leaderLabel{
  font-family:var(--font-display);font-size:clamp(10.5px,1.3vw,12px);
  letter-spacing:1.8px;color:#fde68a;font-weight:800;text-transform:uppercase;
}
.leaderName{
  font-family:var(--font-display);font-size:clamp(20px,3.4vw,28px);
  font-weight:800;letter-spacing:.3px;margin-top:2px;
}
.leaderSub{color:#c7cfdd;font-size:clamp(12px,1.5vw,13.5px);font-weight:600;margin-top:2px}
.leaderProgress{margin-left:auto;text-align:right}
.leaderProgress b{
  font-family:var(--font-display);font-size:clamp(22px,3.6vw,32px);
  color:#fde68a;font-variant-numeric:tabular-nums;
}
.leaderProgress span{display:block;font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-top:2px}

.progressBadge{
  font-family:var(--font-display);font-weight:800;font-size:clamp(11.5px,1.5vw,13px);
  color:#94a3b8;margin-top:3px;letter-spacing:.4px;
}
.progressBadge.leading{color:#fde68a}
.progressBar{height:5px;background:#1c2536;border-radius:99px;margin-top:5px;overflow:hidden;min-width:90px}
.progressBarFill{height:100%;border-radius:99px;background:linear-gradient(90deg,#22c55e,#facc15,#f97316);transition:width .4s ease}

.footer{text-align:center;color:#4b4b5c;font-size:11px;font-weight:600;padding:26px 0 4px;letter-spacing:.3px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <span class="badge">🏁 SCI FUN RACE PART 2 2027</span>
      <h1>LIVE LEADERBOARD</h1>
    </div>
    <div style="text-align:right">
      <div class="liveRow"><span class="dot"></span><span class="liveText">LIVE</span></div>
      <div class="updated" id="updated">Loading…</div>
    </div>
  </div>

  <div id="leaderBanner"></div>

  <div class="section-title">🏆 Finished (fastest time first)</div>
  <div id="finished" class="rows"></div>

  <div class="section-title">⏱ In Progress / Not Started</div>
  <div id="pending" class="rows"></div>
</div>

<div class="footer">🏎️ FUN RACE PART 2 2027 &nbsp;•&nbsp; LIVE DATA FROM GOOGLE SHEET</div>

<script>
// ---- Configuration ----
// Everything the leaderboard shows (finished ranking, live "in
// progress" timers, current-leader progress) is read from the SAME
// Apps Script backend the Game Portal talks to, via JSONP (<script>
// tag). This deliberately avoids fetch() + Google Sheets CSV/CORS —
// a plain fetch() gets blocked with "Access to fetch... blocked by
// CORS policy... origin 'null'" whenever this page is opened as a
// local file:// page (which is exactly how it's meant to be used —
// downloaded and opened straight from a laptop for the venue screen).
// JSONP has no such restriction: it works identically whether this
// page is opened locally or hosted online.
const BACKEND = "https://script.google.com/macros/s/AKfycbw-pDNFmpM_fciXaTicPthAAnTMUARyDvN38ytjRRT_RNgdBl0dosnWnIg-HYxusJCwjA/exec";
const REFRESH_MS = 8000;

// Fixed team list so all 6 teams always show, even before any row exists.
const TEAM_ORDER = ["TEAM 1","TEAM 2","TEAM 3","TEAM 4","TEAM 5","TEAM 6"];
const TEAM_NAMES = {
  "TEAM 1":"Red Gladiator",
  "TEAM 2":"PinkStorm",
  "TEAM 3":"Diamond X",
  "TEAM 4":"Navy Titan",
  "TEAM 5":"Obsidian Elite",
  "TEAM 6":"Onyx"
};

let liveTimerHandle = null;

function formatElapsed(ms){
  const total=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(total/3600);
  const m=Math.floor((total%3600)/60);
  const s=total%60;
  return [h,m,s].map(v=>String(v).padStart(2,"0")).join(":");
}

// ---- JSONP helper (same pattern as the Game Portal) — Apps Script
// Web Apps don't send CORS headers for plain fetch(), so cross-origin
// reads go through a <script> tag callback instead. ----
function jsonp(params, timeoutMs){
  return new Promise(resolve=>{
    const callbackName="fr_lb_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const script=document.createElement("script");
    const query=new URLSearchParams({...params,callback:callbackName});
    let finished=false;

    const cleanup=()=>{
      if(finished)return;
      finished=true;
      if(script.parentNode)script.parentNode.removeChild(script);
      try{delete window[callbackName]}catch(e){}
    };

    const timeout=setTimeout(()=>{cleanup();resolve(null);},timeoutMs||12000);

    window[callbackName]=(data)=>{clearTimeout(timeout);cleanup();resolve(data);};
    script.onerror=()=>{clearTimeout(timeout);cleanup();resolve(null);};
    script.src=BACKEND+"?"+query.toString();
    document.body.appendChild(script);
  });
}

async function fetchTeams(){
  const r=await jsonp({action:"progress"});
  if(!r||!r.ok||!Array.isArray(r.teams))return null;
  const map={};
  r.teams.forEach(t=>{map[t.team]=t;});
  return map;
}

function render(teamsMap){
  const finishedEl=document.getElementById("finished");
  const pendingEl=document.getElementById("pending");
  const bannerEl=document.getElementById("leaderBanner");

  const finished=[];
  const pending=[];

  TEAM_ORDER.forEach(teamId=>{
    const rec=teamsMap[teamId];
    const teamName=(rec&&rec.teamName)||TEAM_NAMES[teamId]||teamId;
    const tasksDone=rec?rec.tasksDone:0;

    if(rec&&rec.status==="COMPLETED"){
      const durationMs=Number(rec.durationMs);
      finished.push({
        teamId, teamName,
        durationText:isFinite(durationMs)?formatElapsed(durationMs):"--:--:--",
        durationSec:isFinite(durationMs)?durationMs/1000:Infinity
      });
    }else if(rec&&rec.status==="RUNNING"){
      pending.push({teamId,teamName,status:"running",startMs:rec.startMs,tasksDone:tasksDone});
    }else{
      pending.push({teamId,teamName,status:"waiting",tasksDone:0});
    }
  });

  finished.sort((a,b)=>a.durationSec-b.durationSec);

  // Running teams first, ranked by progress (most colours unlocked wins);
  // ties broken by earliest start time. "Not started" teams sink to the
  // bottom — there's nothing to rank them on yet.
  pending.sort((a,b)=>{
    if(a.status!==b.status)return a.status==="running"?-1:1;
    if(a.status==="running"){
      if(b.tasksDone!==a.tasksDone)return b.tasksDone-a.tasksDone;
      const as=a.startMs?Number(a.startMs):Infinity;
      const bs=b.startMs?Number(b.startMs):Infinity;
      return as-bs;
    }
    return 0;
  });

  // ---- "Current leader" banner ----
  // A team that has actually FINISHED always outranks a team that's
  // merely in progress — finishing is the whole point, so the fastest
  // completed time is the real leader whenever one exists. Only when
  // NO team has finished yet do we fall back to showing the RUNNING
  // team with the most colours unlocked, as a "leading so far" signal.
  const runningWithProgress=pending.filter(t=>t.status==="running"&&t.tasksDone>0);
  if(finished.length>0){
    const leader=finished[0];
    const tied=finished.filter(t=>t.durationSec===leader.durationSec).length>1;
    bannerEl.innerHTML=
      '<div class="leaderIcon">🏆</div>'+
      '<div>'+
        '<div class="leaderLabel">'+(tied?"Tied for the win":"Current Leader")+'</div>'+
        '<div class="leaderName">'+escapeHtml(leader.teamName)+'</div>'+
        '<div class="leaderSub">'+escapeHtml(leader.teamId)+' &nbsp;•&nbsp; finished</div>'+
      '</div>'+
      '<div class="leaderProgress"><b>'+escapeHtml(leader.durationText)+'</b><span>fastest time</span></div>';
  }else if(runningWithProgress.length>0){
    const leader=runningWithProgress[0];
    const tied=runningWithProgress.filter(t=>t.tasksDone===leader.tasksDone).length>1;
    bannerEl.innerHTML=
      '<div class="leaderIcon">🔥</div>'+
      '<div>'+
        '<div class="leaderLabel">'+(tied?"Tied for the lead":"Current Leader")+'</div>'+
        '<div class="leaderName">'+escapeHtml(leader.teamName)+'</div>'+
        '<div class="leaderSub">'+escapeHtml(leader.teamId)+' &nbsp;•&nbsp; in progress</div>'+
      '</div>'+
      '<div class="leaderProgress"><b>'+leader.tasksDone+'/6</b><span>colours unlocked</span></div>';
  }else{
    bannerEl.innerHTML="";
  }

  finishedEl.innerHTML="";
  if(finished.length===0){
    finishedEl.innerHTML='<div class="empty">No team has finished yet…</div>';
  }else{
    finished.forEach((team,i)=>{
      const rank=i+1;
      const medal=rank===1?"🥇":rank===2?"🥈":rank===3?"🥉":null;
      const rowClass=rank===1?"gold":rank===2?"silver":rank===3?"bronze":"";
      const div=document.createElement("div");
      div.className="row "+rowClass;
      div.innerHTML=
        '<div class="rank'+(medal?" medal":"")+'">'+(medal||rank)+'</div>'+
        '<div class="teamInfo"><b>'+escapeHtml(team.teamName)+'</b><span>'+escapeHtml(team.teamId)+'</span></div>'+
        '<div class="duration">'+escapeHtml(team.durationText)+'</div>';
      finishedEl.appendChild(div);
    });
  }

  pendingEl.innerHTML="";
  if(pending.length===0){
    pendingEl.innerHTML='<div class="empty">All teams have finished! 🎉</div>';
  }else{
    const leaderTasksDone=runningWithProgress.length>0?runningWithProgress[0].tasksDone:-1;
    pending.forEach(team=>{
      const div=document.createElement("div");
      div.className="row";
      const statusLabel=team.status==="running"?"IN PROGRESS":"NOT STARTED";
      const statusClass=team.status==="running"?"running":"waiting";
      const isLeading=team.status==="running"&&team.tasksDone>0&&team.tasksDone===leaderTasksDone;
      const progressHtml=team.status==="running"
        ? '<div class="progressBadge'+(isLeading?" leading":"")+'">'+team.tasksDone+'/6 colours'+
          (isLeading?" 🔥":"")+'</div>'+
          '<div class="progressBar"><div class="progressBarFill" style="width:'+(team.tasksDone/6*100)+'%"></div></div>'
        : '';
      div.innerHTML=
        '<div class="rank">—</div>'+
        '<div class="teamInfo"><b>'+escapeHtml(team.teamName)+'</b><span>'+escapeHtml(team.teamId)+'</span>'+progressHtml+'</div>'+
        '<div class="status '+statusClass+'" data-team="'+escapeHtml(team.teamId)+'" data-start="'+(team.startMs?Number(team.startMs):"")+'">'+
          statusLabel+
          (team.status==="running"?'<span class="liveTimer">00:00:00</span>':'')+
        '</div>';
      pendingEl.appendChild(div);
    });
  }
}

function escapeHtml(str){
  return String(str||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function tickLiveTimers(){
  document.querySelectorAll(".status.running").forEach(el=>{
    const start=Number(el.getAttribute("data-start"));
    const timerEl=el.querySelector(".liveTimer");
    if(!start||!timerEl)return;
    timerEl.textContent=formatElapsed(Date.now()-start);
  });
}

async function refresh(){
  try{
    const teamsMap=await fetchTeams();
    if(!teamsMap)throw new Error("No response from backend");
    render(teamsMap);
    document.getElementById("updated").textContent="Last updated: "+new Date().toLocaleTimeString();
  }catch(err){
    document.getElementById("updated").textContent="⚠ Unable to reach game server — retrying…";
  }
}

refresh();
setInterval(refresh,REFRESH_MS);
clearInterval(liveTimerHandle);
liveTimerHandle=setInterval(tickLiveTimers,1000);
</script>
</body>
</html>
