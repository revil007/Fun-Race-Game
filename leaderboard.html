<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>FUN RACE 2026 — Live Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--font-display:'Rajdhani','Inter',Arial,sans-serif;--font-body:'Inter',Arial,Helvetica,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;font-family:var(--font-body);color:#f8fafc;
  background:
    radial-gradient(circle at 12% 12%, rgba(59,130,246,.26) 0, transparent 24%),
    radial-gradient(circle at 88% 14%, rgba(239,68,68,.22) 0, transparent 24%),
    radial-gradient(circle at 78% 88%, rgba(168,85,247,.2) 0, transparent 26%),
    linear-gradient(135deg,#07111f 0%,#0d1524 45%,#090d18 100%);
  padding:clamp(18px,3vw,40px);
  overflow-x:hidden;
}
.wrap{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:clamp(18px,3vw,30px)}
.badge{
  display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(250,204,21,.55);
  background:rgba(250,204,21,.08);border-radius:999px;padding:8px 16px;
  font-family:var(--font-display);font-size:clamp(11px,1.4vw,13px);letter-spacing:2px;
  color:#fde68a;font-weight:800;
}
h1{
  font-family:var(--font-display);font-weight:800;
  font-size:clamp(28px,5vw,48px);letter-spacing:2px;margin-top:8px;
  text-shadow:0 4px 24px rgba(59,130,246,.35);
}
.liveRow{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.liveText{font-family:var(--font-display);font-weight:700;letter-spacing:1.5px;color:#86efac;font-size:clamp(13px,1.6vw,16px)}
.updated{color:#64748b;font-size:12px;margin-top:4px}

.section-title{
  font-family:var(--font-display);font-weight:800;letter-spacing:1.5px;
  font-size:clamp(14px,1.8vw,18px);color:#94a3b8;text-transform:uppercase;
  margin:clamp(20px,3vw,30px) 0 12px;
}

.rows{display:flex;flex-direction:column;gap:10px}
.row{
  display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:clamp(10px,2vw,20px);
  background:rgba(11,17,29,.85);border:1px solid rgba(71,85,105,.5);
  border-radius:18px;padding:clamp(12px,2vw,18px) clamp(14px,2.4vw,22px);
  backdrop-filter:blur(6px);
}
.row.gold{border-color:rgba(250,204,21,.7);box-shadow:0 0 0 1px rgba(250,204,21,.25),0 12px 34px rgba(250,204,21,.12)}
.row.silver{border-color:rgba(203,213,225,.6)}
.row.bronze{border-color:rgba(217,119,6,.6)}
.rank{
  font-family:var(--font-display);font-weight:800;font-size:clamp(20px,2.6vw,28px);
  text-align:center;color:#94a3b8;
}
.rank.medal{font-size:clamp(26px,3.4vw,36px)}
.teamInfo b{
  display:block;font-family:var(--font-display);font-weight:800;
  font-size:clamp(17px,2.4vw,24px);letter-spacing:.4px;
}
.teamInfo span{display:block;color:#8d99ad;font-size:clamp(11px,1.3vw,13px);margin-top:2px;font-weight:600}
.duration{
  font-family:var(--font-display);font-weight:800;font-variant-numeric:tabular-nums;
  font-size:clamp(20px,3vw,30px);color:#facc15;text-align:right;
}
.status{
  font-family:var(--font-display);font-weight:700;letter-spacing:1px;
  font-size:clamp(13px,1.6vw,16px);text-align:right;
}
.status.running{color:#38bdf8}
.status.waiting{color:#64748b}
.liveTimer{font-variant-numeric:tabular-nums;font-size:clamp(15px,2vw,20px);color:#38bdf8;display:block;margin-top:2px}

.empty{
  text-align:center;color:#64748b;font-size:13px;padding:18px;
  border:1px dashed #2a2a38;border-radius:16px;
}

.footer{text-align:center;color:#4b4b5c;font-size:11px;font-weight:600;padding:26px 0 4px;letter-spacing:.3px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <span class="badge">🏁 COMPANY FUN RACE 2026</span>
      <h1>LIVE LEADERBOARD</h1>
    </div>
    <div style="text-align:right">
      <div class="liveRow"><span class="dot"></span><span class="liveText">LIVE</span></div>
      <div class="updated" id="updated">Loading…</div>
    </div>
  </div>

  <div class="section-title">🏆 Finished (fastest time first)</div>
  <div id="finished" class="rows"></div>

  <div class="section-title">⏱ In Progress / Not Started</div>
  <div id="pending" class="rows"></div>
</div>

<div class="footer">🏎️ FUN RACE 2026 &nbsp;•&nbsp; LIVE DATA FROM GOOGLE SHEET</div>

<script>
// ---- Configuration ----
const SHEET_ID = "1FWOx0wLlgACMP_QgYpavaYafMzsKZM1ons2-mBm88Bs";
const GID = "0";
const CSV_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv&gid=" + GID;
const REFRESH_MS = 8000;

// Fixed team list so all 6 teams always show, even before any row exists.
const TEAM_ORDER = ["TEAM 1","TEAM 2","TEAM 3","TEAM 4","TEAM 5","TEAM 6"];
const TEAM_NAMES = {
  "TEAM 1":"Red Gladiator",
  "TEAM 2":"PinkStorm",
  "TEAM 3":"Diamond X",
  "TEAM 4":"Navy Titan",
  "TEAM 5":"Obsidian Elite",
  "TEAM 6":"Onyx"
};

let liveTimerHandle = null;

function parseCSV(text){
  const rows=[];
  let row=[],field="",inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){field+='"';i++;}
        else inQuotes=false;
      }else field+=c;
    }else{
      if(c==='"')inQuotes=true;
      else if(c===','){row.push(field);field="";}
      else if(c==='\n'||c==='\r'){
        if(c==='\r'&&text[i+1]==='\n')i++;
        row.push(field);field="";
        if(row.length>1||row[0]!=="")rows.push(row);
        row=[];
      }else field+=c;
    }
  }
  if(field.length||row.length){row.push(field);if(row.length>1||row[0]!=="")rows.push(row);}
  return rows;
}

function parseSheetDate(str){
  // Expected format: DD/MM/YYYY HH:MM:SS
  if(!str)return null;
  const m=str.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})$/);
  if(!m)return null;
  const [,dd,mm,yyyy,hh,mi,ss]=m.map(Number);
  return new Date(yyyy,mm-1,dd,hh,mi,ss);
}

function durationToSeconds(str){
  if(!str)return Infinity;
  const parts=str.split(":").map(Number);
  if(parts.length!==3||parts.some(isNaN))return Infinity;
  return parts[0]*3600+parts[1]*60+parts[2];
}

function formatElapsed(ms){
  const total=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(total/3600);
  const m=Math.floor((total%3600)/60);
  const s=total%60;
  return [h,m,s].map(v=>String(v).padStart(2,"0")).join(":");
}

async function fetchStandings(){
  const res=await fetch(CSV_URL+"&_="+Date.now(),{cache:"no-store"});
  if(!res.ok)throw new Error("HTTP "+res.status);
  const text=await res.text();
  const rows=parseCSV(text);
  if(rows.length<2)return {};

  const header=rows[0].map(h=>h.trim());
  const idx=name=>header.indexOf(name);
  const iEvent=idx("Event"), iTeamId=idx("Team ID"), iTeamName=idx("Team Name"),
        iStart=idx("Start Time"), iFinish=idx("Finish Time"), iDuration=idx("Game Duration");

  // Latest row per team wins (sheet is append-only in chronological order).
  const latest={};
  for(let r=1;r<rows.length;r++){
    const row=rows[r];
    const teamId=(row[iTeamId]||"").trim();
    if(!teamId)continue;
    latest[teamId]={
      event:(row[iEvent]||"").trim(),
      teamName:(row[iTeamName]||"").trim() || TEAM_NAMES[teamId] || teamId,
      startTime:row[iStart],
      finishTime:row[iFinish],
      duration:row[iDuration]
    };
  }
  return latest;
}

function render(latest){
  const finishedEl=document.getElementById("finished");
  const pendingEl=document.getElementById("pending");

  const finished=[];
  const pending=[];

  TEAM_ORDER.forEach(teamId=>{
    const rec=latest[teamId];
    const teamName=(rec&&rec.teamName)||TEAM_NAMES[teamId]||teamId;

    if(rec&&rec.event==="COMPLETED"){
      finished.push({
        teamId, teamName,
        durationText:rec.duration||"--:--:--",
        durationSec:durationToSeconds(rec.duration)
      });
    }else if(rec&&rec.event==="STARTED"){
      pending.push({teamId,teamName,status:"running",startTime:parseSheetDate(rec.startTime)});
    }else{
      pending.push({teamId,teamName,status:"waiting"});
    }
  });

  finished.sort((a,b)=>a.durationSec-b.durationSec);

  finishedEl.innerHTML="";
  if(finished.length===0){
    finishedEl.innerHTML='<div class="empty">No team has finished yet…</div>';
  }else{
    finished.forEach((team,i)=>{
      const rank=i+1;
      const medal=rank===1?"🥇":rank===2?"🥈":rank===3?"🥉":null;
      const rowClass=rank===1?"gold":rank===2?"silver":rank===3?"bronze":"";
      const div=document.createElement("div");
      div.className="row "+rowClass;
      div.innerHTML=
        '<div class="rank'+(medal?" medal":"")+'">'+(medal||rank)+'</div>'+
        '<div class="teamInfo"><b>'+escapeHtml(team.teamName)+'</b><span>'+escapeHtml(team.teamId)+'</span></div>'+
        '<div class="duration">'+escapeHtml(team.durationText)+'</div>';
      finishedEl.appendChild(div);
    });
  }

  pendingEl.innerHTML="";
  if(pending.length===0){
    pendingEl.innerHTML='<div class="empty">All teams have finished! 🎉</div>';
  }else{
    pending.forEach(team=>{
      const div=document.createElement("div");
      div.className="row";
      const statusLabel=team.status==="running"?"IN PROGRESS":"NOT STARTED";
      const statusClass=team.status==="running"?"running":"waiting";
      div.innerHTML=
        '<div class="rank">—</div>'+
        '<div class="teamInfo"><b>'+escapeHtml(team.teamName)+'</b><span>'+escapeHtml(team.teamId)+'</span></div>'+
        '<div class="status '+statusClass+'" data-team="'+escapeHtml(team.teamId)+'" data-start="'+(team.startTime?team.startTime.getTime():"")+'">'+
          statusLabel+
          (team.status==="running"?'<span class="liveTimer">00:00:00</span>':'')+
        '</div>';
      pendingEl.appendChild(div);
    });
  }
}

function escapeHtml(str){
  return String(str||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function tickLiveTimers(){
  document.querySelectorAll(".status.running").forEach(el=>{
    const start=Number(el.getAttribute("data-start"));
    const timerEl=el.querySelector(".liveTimer");
    if(!start||!timerEl)return;
    timerEl.textContent=formatElapsed(Date.now()-start);
  });
}

async function refresh(){
  try{
    const latest=await fetchStandings();
    render(latest);
    document.getElementById("updated").textContent="Last updated: "+new Date().toLocaleTimeString();
  }catch(err){
    document.getElementById("updated").textContent="⚠ Unable to load standings — retrying…";
  }
}

refresh();
setInterval(refresh,REFRESH_MS);
clearInterval(liveTimerHandle);
liveTimerHandle=setInterval(tickLiveTimers,1000);
</script>
</body>
</html>
